[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PackInstaller"
version = "0.0.3-dev"
description = "Install packages directly on Discord without asking your hoster if you don't host your dex :3"
license = "MIT"
authors = [{ name = "Glitch" }]
readme = "README.md"
dependencies = ["packaging>=23.0"]

[project.urls]
Repository = "https://github.com/GlitchedGlitch//Ballsdex-PackInstaller"

[tool.setuptools.packages.find]
where = ["."]
include = ["packinstaller*"] 
